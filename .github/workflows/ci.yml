name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A follow-up push makes the previous run pointless; drop it instead of paying
# for both.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Windows is the platform this plugin ships on, so every Windows leg blocks a
  # merge. The Linux leg runs the same suite as a canary: it reports, but a
  # Linux-only quirk must not hold up a release of a Windows-first plugin.
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 20 is the floor the plugin may meet inside an older Electron; 24 is
          # the current LTS.
          - os: windows-latest
            node: 20
          - os: windows-latest
            node: 22
          - os: windows-latest
            node: 24
          - os: ubuntu-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Show environment
        run: |
          node --version
          npm --version

      - name: Unit and integration tests
        run: npm test

  # The only job that runs a real dcg binary; everything in `test` feeds it fake
  # verdicts. It runs on every push to main as well, so the merged state is
  # validated with the binary too — a merge can differ from the PR it came from,
  # and a direct push skips the PR entirely. Windows blocks, Linux is the canary,
  # and both run beside the matrix rather than after it. No secrets involved: it
  # downloads a public release, so fork PRs get the same check.
  live:
    name: live dcg (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Downloads the version pinned in lib/install.js, refuses the archive unless
      # it matches the baked-in SHA-256, then appends the directory to PATH.
      - name: Install the pinned dcg
        run: node tools/ci-install-dcg.mjs

      - name: Show the binary the gate will find
        run: dcg --version

      - name: End-to-end against the real binary
        run: npm run test:live

  # The tarball is what users install. Packaging is checked on Windows because
  # that is where this repository is built and where path handling differs.
  manifest:
    name: publish manifest
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Every runtime file is shipped, and nothing else
        run: npm run check:pack

      # Offline: snapshots are committed JSON, so these need no dcg binary.
      - name: dcg compatibility chain is unbroken
        run: node tools/compat.mjs check

      - name: Every rule pack is exercised by the corpus
        run: node tools/compat.mjs coverage --family all

      - name: The default install answers what the docs promise
        run: node tools/compat.mjs coverage --family plugin
